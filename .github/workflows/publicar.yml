# Publica no PyPI quando sai uma versão (release) no GitHub. Sem token: usa Trusted Publishing,
# configurado no pypi.org para o repositório canpse/fala, workflow publicar.yml, ambiente pypi.
name: publicar

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
