[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fala"
version = "0.1.1"
description = "Say what you want in plain language; fa puts the shell command on your prompt to check and run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Campestrini", email = "lucas.campestrini@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["shell", "terminal", "cli", "llm", "natural-language", "bash", "zsh"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/canpse/fala"
Issues = "https://github.com/canpse/fala/issues"

[project.scripts]
fa = "fala.cli:main"

[tool.setuptools]
packages = ["fala"]

[tool.setuptools.package-data]
fala = ["dados/*", "dados/pacotes/*"]
